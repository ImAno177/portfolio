<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e6fb8"/>
      <stop offset="0.35" stop-color="#5fa3d9"/>
      <stop offset="0.7" stop-color="#a8d4ec"/>
      <stop offset="1" stop-color="#e3f0ec"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbfa8"/>
      <stop offset="1" stop-color="#6ba58e"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb27f"/>
      <stop offset="1" stop-color="#4f9768"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a058"/>
      <stop offset="1" stop-color="#3d7f49"/>
    </linearGradient>
    <radialGradient id="cloudTop" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#fdfbf3"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </radialGradient>
    <linearGradient id="cloudShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d8e9"/>
      <stop offset="1" stop-color="#9cb8d8"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d9ae"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- high wispy cirrus -->
  <g opacity="0.5" fill="#ffffff">
    <ellipse cx="300" cy="120" rx="220" ry="14"/>
    <ellipse cx="420" cy="140" rx="160" ry="10"/>
    <ellipse cx="1500" cy="90" rx="260" ry="12"/>
    <ellipse cx="1650" cy="115" rx="140" ry="9"/>
    <ellipse cx="1050" cy="70" rx="180" ry="9"/>
  </g>

  <!-- towering cumulus, main mass right-of-center -->
  <g>
    <!-- shadowed underside -->
    <g fill="url(#cloudShade)">
      <ellipse cx="1210" cy="560" rx="330" ry="90"/>
      <ellipse cx="1420" cy="540" rx="240" ry="80"/>
      <ellipse cx="1010" cy="545" rx="180" ry="70"/>
      <ellipse cx="1560" cy="575" rx="150" ry="55"/>
    </g>
    <!-- sunlit billows -->
    <g fill="url(#cloudTop)">
      <circle cx="1150" cy="330" r="120"/>
      <circle cx="1280" cy="300" r="140"/>
      <circle cx="1420" cy="330" r="120"/>
      <circle cx="1060" cy="390" r="105"/>
      <circle cx="1530" cy="400" r="100"/>
      <circle cx="1190" cy="430" r="115"/>
      <circle cx="1360" cy="440" r="110"/>
      <circle cx="1000" cy="470" r="80"/>
      <circle cx="1600" cy="480" r="75"/>
      <ellipse cx="1290" cy="500" rx="300" ry="80"/>
    </g>
    <!-- inner shade creases -->
    <g fill="#b9cde3" opacity="0.85">
      <ellipse cx="1180" cy="470" rx="90" ry="34"/>
      <ellipse cx="1400" cy="480" rx="80" ry="30"/>
      <ellipse cx="1040" cy="520" rx="110" ry="30"/>
      <ellipse cx="1520" cy="525" rx="80" ry="26"/>
    </g>
  </g>

  <!-- left cloud bank -->
  <g>
    <g fill="url(#cloudShade)">
      <ellipse cx="330" cy="520" rx="230" ry="60"/>
      <ellipse cx="160" cy="545" rx="140" ry="45"/>
    </g>
    <g fill="url(#cloudTop)">
      <circle cx="250" cy="390" r="85"/>
      <circle cx="370" cy="380" r="95"/>
      <circle cx="480" cy="410" r="75"/>
      <circle cx="180" cy="450" r="70"/>
      <circle cx="330" cy="450" r="90"/>
      <circle cx="460" cy="475" r="65"/>
      <ellipse cx="330" cy="500" rx="220" ry="55"/>
    </g>
    <ellipse cx="300" cy="515" rx="150" ry="34" fill="#b9cde3" opacity="0.8"/>
  </g>

  <!-- small distant puff -->
  <g>
    <ellipse cx="760" cy="470" rx="120" ry="40" fill="url(#cloudShade)"/>
    <circle cx="730" cy="410" r="55" fill="url(#cloudTop)"/>
    <circle cx="810" cy="420" r="48" fill="url(#cloudTop)"/>
    <ellipse cx="760" cy="450" rx="105" ry="30" fill="url(#cloudTop)"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 700 Q180 620 380 668 Q560 610 760 660 Q960 600 1150 655 Q1350 615 1520 665 Q1720 620 1920 668 V1080 H0 Z" fill="#9dbfb8" opacity="0.75"/>
  <path d="M0 730 Q260 660 520 705 Q800 650 1080 700 Q1380 655 1640 705 Q1800 675 1920 700 V1080 H0 Z" fill="url(#hillFar)"/>

  <!-- mid hills -->
  <path d="M0 800 Q300 720 620 765 Q900 710 1200 770 Q1500 720 1780 775 Q1860 780 1920 770 V1080 H0 Z" fill="url(#hillMid)"/>
  <!-- tree line on mid hill -->
  <path d="M0 800 Q300 720 620 765 Q900 710 1200 770 Q1500 720 1780 775 Q1860 780 1920 770 L1920 810 Q1500 760 1200 810 Q900 750 620 805 Q300 760 0 840 Z" fill="#4c8a5e" opacity="0.6"/>

  <!-- near meadow -->
  <path d="M0 900 Q320 830 700 880 Q1080 820 1420 875 Q1700 830 1920 875 V1080 H0 Z" fill="url(#hillNear)"/>

  <!-- winding dirt path -->
  <path d="M980 1080 Q960 990 1060 945 Q1150 905 1120 880 Q1100 862 1150 845 L1175 852 Q1130 872 1160 892 Q1230 930 1130 985 Q1070 1020 1090 1080 Z" fill="url(#pathGrad)" opacity="0.9"/>

  <!-- little house on the mid hill -->
  <g transform="translate(1185 768)">
    <rect x="0" y="14" width="46" height="30" fill="#f4ecd8"/>
    <path d="M-5 15 L23 -6 L51 15 Z" fill="#c0503c"/>
    <rect x="34" y="20" width="8" height="12" fill="#7a5a3a"/>
    <rect x="6" y="22" width="10" height="9" fill="#8fb8d8"/>
    <rect x="20" y="28" width="9" height="16" fill="#8a6a48"/>
    <path d="M-5 15 L23 -6 L51 15 L48 17 L23 0 L-2 17 Z" fill="#a03828"/>
  </g>

  <!-- lone big tree, left foreground -->
  <g transform="translate(180 700)">
    <path d="M78 190 L86 120 L74 128 L88 100 L80 108 L90 84 L100 108 L94 104 L104 128 L94 124 L102 190 Z" fill="#5a4632"/>
    <g fill="#3d7a44">
      <circle cx="70" cy="60" r="55"/>
      <circle cx="115" cy="55" r="48"/>
      <circle cx="45" cy="90" r="40"/>
      <circle cx="135" cy="92" r="42"/>
      <circle cx="90" cy="35" r="45"/>
    </g>
    <g fill="#55a05c" opacity="0.9">
      <circle cx="60" cy="48" r="30"/>
      <circle cx="100" cy="42" r="26"/>
      <circle cx="80" cy="70" r="34"/>
      <circle cx="125" cy="75" r="24"/>
    </g>
    <g fill="#7cc07a" opacity="0.8">
      <circle cx="55" cy="40" r="14"/>
      <circle cx="95" cy="30" r="12"/>
      <circle cx="75" cy="58" r="16"/>
    </g>
  </g>

  <!-- small trees on hills -->
  <g fill="#3d7a44">
    <circle cx="560" cy="800" r="14"/><circle cx="590" cy="795" r="10"/><circle cx="545" cy="808" r="9"/>
    <circle cx="1450" cy="790" r="16"/><circle cx="1480" cy="798" r="11"/>
    <circle cx="1650" cy="820" r="12"/><circle cx="1670" cy="815" r="9"/>
    <circle cx="850" cy="830" r="10"/>
  </g>
  <g fill="#5a4632">
    <rect x="558" y="806" width="4" height="12"/><rect x="1448" y="800" width="5" height="14"/>
    <rect x="1648" y="826" width="4" height="10"/>
  </g>

  <!-- foreground grass tufts + wildflowers -->
  <g>
    <g stroke="#2e6b3a" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M120 1030 q4 -18 8 -22 M132 1032 q-2 -16 2 -24 M142 1030 q6 -14 10 -16"/>
      <path d="M340 1050 q4 -18 8 -22 M352 1052 q-2 -16 2 -24"/>
      <path d="M700 1040 q4 -16 8 -20 M712 1042 q-2 -14 2 -22 M722 1040 q6 -12 10 -14"/>
      <path d="M1560 1045 q4 -18 8 -22 M1572 1047 q-2 -16 2 -24 M1582 1045 q6 -14 10 -16"/>
      <path d="M1820 1020 q4 -16 8 -20 M1832 1022 q-2 -14 2 -22"/>
    </g>
    <g fill="#fff">
      <circle cx="250" cy="1000" r="3"/><circle cx="268" cy="1012" r="2.5"/><circle cx="236" cy="1018" r="2.5"/>
      <circle cx="880" cy="990" r="3"/><circle cx="900" cy="1002" r="2.5"/>
      <circle cx="1330" cy="1008" r="3"/><circle cx="1350" cy="996" r="2.5"/>
      <circle cx="1700" cy="990" r="3"/><circle cx="1722" cy="1004" r="2.5"/>
    </g>
    <g fill="#f4d35e">
      <circle cx="290" cy="1006" r="2.6"/><circle cx="860" cy="1010" r="2.6"/>
      <circle cx="1400" cy="1020" r="2.6"/><circle cx="1760" cy="1014" r="2.6"/>
    </g>
    <g fill="#e88aa0">
      <circle cx="228" cy="996" r="2.6"/><circle cx="920" cy="982" r="2.6"/>
      <circle cx="1300" cy="988" r="2.6"/>
    </g>
  </g>

  <!-- a few birds -->
  <g stroke="#3a5068" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M620 250 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M680 280 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M590 300 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- soft sunlight vignette -->
  <radialGradient id="sun" cx="0.78" cy="0.12" r="0.55">
    <stop offset="0" stop-color="#fff8dc" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#fff8dc" stop-opacity="0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#sun)"/>
</svg>
